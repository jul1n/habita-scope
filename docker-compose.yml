services:
  db:
    image: postgis/postgis:16-3.4
    container_name: logement-db
    restart: always
    environment:
      POSTGRES_DB: logement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    # Pas de "ports:" : la base n'est joignable que depuis le réseau Docker (service backend).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logement"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: logement-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/logement
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    # Exposé uniquement à nginx (réseau Docker) ; ajouter "127.0.0.1:8000:8000" pour le debug local.
    volumes:
      - ./processed:/processed

  frontend:
    image: nginx:alpine
    container_name: logement-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
